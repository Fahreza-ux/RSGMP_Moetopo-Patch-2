<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSGMP Moestopo - Portal Internal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .sop-card { transition: all 0.3s ease; }
        .dark-mode { background-color: #0f172a !important; color: #f1f5f9 !important; }
        .dark-mode .bg-white { background-color: #1e293b !important; color: #f1f5f9 !important; border-color: #334155 !important; }
    </style>
</head>
<body class="bg-slate-50">
    <nav class="bg-white p-4 shadow-sm sticky top-0 z-50">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <span class="font-bold text-purple-700">RSGMP MOESTOPO</span>
            <button onclick="document.body.classList.toggle('dark-mode')" class="text-xs bg-slate-800 text-white px-3 py-1 rounded-full">Mode Teduh</button>
        </div>
    </nav>
    <main class="max-w-4xl mx-auto p-4 py-8">
        <div class="mb-8">
            <input type="text" id="sop-search-input" onkeyup="filterSopCards()" class="w-full p-4 rounded-full border border-slate-300 outline-none focus:ring-2 focus:ring-purple-500" placeholder="Cari SOP...">
        </div>
        <div id="sop-cards-container" class="grid md:grid-cols-3 gap-4">
            <div class="sop-card bg-white p-6 rounded-2xl border shadow-sm">
                <h3 class="font-bold">Pengolahan Limbah B3</h3>
                <p class="text-sm text-slate-500 mt-2">SOP penanganan limbah medis.</p>
            </div>
            <div class="sop-card bg-white p-6 rounded-2xl border shadow-sm">
                <h3 class="font-bold">Sterilisasi CSSD</h3>
                <p class="text-sm text-slate-500 mt-2">Prosedur sterilisasi alur satu arah.</p>
            </div>
            <div class="sop-card bg-white p-6 rounded-2xl border shadow-sm">
                <h3 class="font-bold">Mitigasi Kebakaran</h3>
                <p class="text-sm text-slate-500 mt-2">Prosedur evakuasi dan penggunaan APAR.</p>
            </div>
        </div>
    </main>
    <script>
        function filterSopCards() {
            let input = document.getElementById('sop-search-input').value.toLowerCase();
            let cards = document.getElementsByClassName('sop-card');
            for (let card of cards) {
                card.style.display = card.innerText.toLowerCase().includes(input) ? "" : "none";
            }
        }
    </script>
</body>
</html>
