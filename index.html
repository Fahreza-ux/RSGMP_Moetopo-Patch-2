<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RSGMP Moestopo - Portal Internal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-center my-8">RSGMP Moestopo Internal</h1>
        
        <input type="text" id="sop-search" onkeyup="search()" class="w-full p-4 rounded-lg border" placeholder="Cari SOP...">

        <div id="container" class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-6">
            <div class="card bg-white p-6 rounded shadow">
                <h3 class="font-bold">Limbah B3</h3>
                <p class="text-sm">Panduan limbah medis.</p>
            </div>
            <div class="card bg-white p-6 rounded shadow">
                <h3 class="font-bold">Sterilisasi</h3>
                <p class="text-sm">Prosedur sterilisasi alat.</p>
            </div>
        </div>
    </div>

    <script>
        function search() {
            let val = document.getElementById('sop-search').value.toLowerCase();
            let cards = document.getElementsByClassName('card');
            for(let card of cards) {
                card.style.display = card.innerText.toLowerCase().includes(val) ? "" : "none";
            }
        }
    </script>
</body>
</html>
